{% extends 'base.html' %}
{% block title %}Register | Mood Weather{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'accounts/_form_fields.html' %}
    <button type="submit" class="btn">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</section>
{% endblock %}
