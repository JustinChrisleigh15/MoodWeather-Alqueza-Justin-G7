{% extends 'base.html' %}
{% block title %}Log in | Mood Weather{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
    {% include 'accounts/_form_fields.html' %}
    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
</section>
{% endblock %}
