{% extends 'base.html' %}
{% block title %}Delete entry | Mood Weather{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Delete this entry?</h1>
  <p>Your entry for <strong>{{ entry.entry_date|date:"F d, Y" }}</strong> will be permanently removed.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Yes, delete</button>
    <a href="{% url 'moods:entry_detail' entry.pk %}">Cancel</a>
  </form>
</section>
{% endblock %}
